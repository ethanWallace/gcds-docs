name: A11y test documentation site

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'reports/**'
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - docs/**
      - .github/workflows/a11y-tests.yaml

jobs:
  a11y-test:
    name: ${{ matrix.test.name }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        test:
          - name: English site
            spec: cypress/e2e/a11y-en.cy.js
          - name: French site
            spec: cypress/e2e/a11y-fr.cy.js

    steps:
      - name: Git Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: '22'

      - name: build
        working-directory: ./docs
        run: npm ci && npm run build

      - name: Verify Astro preview
        working-directory: ./docs
        run: |
          npm run preview:ci > /tmp/astro-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/sitemap-index.xml; then
              echo "Astro preview is responding"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/astro-preview.log
          exit 1

      - name: Cypress run
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6.10.9
        with:
          working-directory: ./docs
          build: npm run build
          start: npm run preview:ci
          wait-on: "http://127.0.0.1:4321/sitemap-index.xml"
          # wait for 4 minutes for the server to respond
          wait-on-timeout: 240
          spec: ${{ matrix.test.spec }}
